<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="../../styles.css">
</head>

<body>
    <div id="hero">
        <div>
            <a href="../"><button style="height: fit-content;
                width: fit-content;">back</button></a>
                <br>
            <iframe height="500" 
                width="700" 
                id="gameFrame" 
                src="index1.html" 
                scrolling="no" 
                allow="fullscreen; keyboard"
                allowfullscreen 
                title="Game"
            ></iframe>
            <br>
            <div id="hero" style="height: 5vh;">
                <button onclick="toggleFullScreen()" style="height: fit-content;
                width: fit-content;">Full Screen</button>
            </div>
        </div>
    </div>
    <script>
        const iframe = document.getElementById('gameFrame');
        function toggleFullScreen() {
            iframe.contentWindow.focus();
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.mozRequestFullScreen) {
                iframe.mozRequestFullScreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            } else if (iframe.msRequestFullscreen) {
                iframe.msRequestFullscreen();
            } else {
                alert("Fullscreen not supported in this browser.");
            }
            setTimeout(() => {
                iframe.contentWindow.focus();
            }, 500);
        }
        iframe.addEventListener('click', () => {
            iframe.contentWindow.focus();
        });
    </script>
</body>

</html>
